name: Ejecutar bot snapshot-builder

# Único bot del proyecto que usa OAuth (OAUTH_REFRESH_TOKEN, cuenta
# services.aportes.oser@gmail.com) en vez de la Service Account, porque es
# el único que necesita CREAR archivos nuevos en Drive: los snapshots
# iniciales de reparticiones nuevas y, cuando hace falta, nuevas planillas
# _registro_agentes_N (ver utils/registro_utils.py -> verificar_y_ampliar_capacidad).
#
# Se puede disparar de dos formas:
#   - workflow_dispatch: manual, suelto, como siempre.
#   - workflow_call: como job previo desde otro workflow (ver monitoreo.yml,
#     que lo llama antes de correr monitoreo_bot.py para que las
#     reparticiones nuevas tengan snapshot inicial sin depender de acordarse
#     de correrlo a mano). Los snapshots que ya existen se saltean solos
#     (ver snapshot_bot.py), así que llamarlo seguido no reprocesa nada de más.

on:
  workflow_dispatch:   # Manual, suelto
  workflow_call:        # Invocable como job previo desde otros workflows

jobs:
  run-task:
    runs-on: ubuntu-22.04
    timeout-minutes: 180   # 2:20 horas de margen

    env:
      OAUTH_REFRESH_TOKEN:  ${{ secrets.OAUTH_REFRESH_TOKEN }}
      GDRIVE_JSON:          ${{ secrets.GDRIVE_JSON }}
      SMTP_TO_UNIFICADOR:   ${{ secrets.SMTP_TO_UNIFICADOR }}
      SMTP_FROM:            ${{ secrets.SMTP_FROM }}
      SMTP_PASSWORD:        ${{ secrets.SMTP_PASSWORD }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Mostrar hora actual del servidor
        run: date

      - name: Instalar Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install \
            google-api-python-client==2.121.0 \
            google-auth==2.29.0 \
            google-auth-oauthlib==1.2.0 \
            google-auth-httplib2==0.2.0 \
            httplib2==0.22.0

      - name: Ejecutar snapshot builder
        run: python -u src/snapshot_bot.py

      - name: Mostrar finalización
        run: echo "✅ Snapshot builder ejecutado."