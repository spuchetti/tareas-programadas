name: Limpiar runs de Actions

# Borra TODOS los runs de TODOS los workflows del repo (todos los bots),
# sin respetar ninguna ventana de retención. Si un run se borra, el
# artifact que subió se borra con él, sin importar el retention-days
# configurado en el upload-artifact.
#
# Se excluyen únicamente:
#   - el run actual (el que está ejecutando esta limpieza)
#   - runs que estén "in_progress" o "queued" (en curso)

on:
  workflow_dispatch:      # Para probarlo o dispararlo a mano cuando quieras
  schedule:
    - cron: "0 01 1 * *"  # Día 1 de cada mes, 06 UTC (3am Argentina)

permissions:
  actions: write
  contents: read

jobs:
  limpiar-runs:
    runs-on: ubuntu-22.04
    steps:
      - name: Borrar todos los runs de todos los workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          CURRENT_RUN_ID="${{ github.run_id }}"

          echo "Borrando todos los runs del repo (sin ventana de retención)."
          echo "(se excluye el run actual: $CURRENT_RUN_ID, y los que estén en curso)"

          while true; do
            RUNS=$(gh run list -R "$OWNER/$REPO" --limit 100 \
              --json databaseId,status \
              --jq ".[] | select(.databaseId != $CURRENT_RUN_ID and .status != \"in_progress\" and .status != \"queued\") | .databaseId")

            if [[ -z "$RUNS" ]]; then
              echo "No hay más runs para borrar."
              break
            fi

            echo "$RUNS" | while read -r RUN_ID; do
              echo "Borrando run ID $RUN_ID..."
              gh run delete "$RUN_ID" -R "$OWNER/$REPO"
            done
          done

          echo "🧹 Limpieza completa."